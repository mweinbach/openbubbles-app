// Release-like device benchmarks and Baseline Profile generation.
plugins {
    id "com.android.test"
    id "androidx.baselineprofile"
}

android {
    namespace "app.openbubbles.benchmark"
    compileSdk 37

    defaultConfig {
        // Baseline Profiles are not needed below API 28 because those releases
        // fully AOT-compile apps during installation.
        minSdk 28
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    targetProjectPath = ":app-native"
    // Macrobenchmark must run outside the target app process.
    experimentalProperties["android.experimental.self-instrumenting"] = true

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

baselineProfile {
    // The connected Pixel is the performance oracle. CI can compile this
    // module without pretending emulator timings are representative.
    useConnectedDevices = true
}

dependencies {
    implementation libs.androidx.benchmark.macro.junit4
    implementation libs.androidx.test.ext.junit
    implementation libs.androidx.test.runner
    implementation libs.androidx.test.uiautomator
}

// Dependency Baseline Profiles are not evidence that OpenBubbles' own startup,
// chat-list, and Photos paths were captured. Refuse to launch a measurement
// run until generation has produced the app-owned profile source. This check
// runs before the connected task installs or uninstalls either APK.
def appBaselineProfile = rootProject.file(
        "app-native/src/release/generated/baselineProfiles/baseline-prof.txt",
)
def verifyAppBaselineProfile = tasks.register("verifyAppBaselineProfile") {
    group = "verification"
    description = "Requires committed app-owned startup, chat, and Photos Baseline Profile coverage."
    outputs.upToDateWhen { false }
    doLast {
        if (!appBaselineProfile.isFile() || appBaselineProfile.length() == 0L) {
            throw new GradleException(
                    "Commit ${appBaselineProfile} before running Macrobenchmark; " +
                    "dependency profiles alone do not cover OpenBubbles journeys.",
            )
        }
        def profileRules = appBaselineProfile.readLines("UTF-8")
                .collect { it.trim() }
                .findAll { it && !it.startsWith("#") }
        def requiredJourneyOwners = [
                startup: "Lapp/openbubbles/nativeapp/NativeMainActivity;",
                chats  : "Lapp/openbubbles/nativeapp/ui/chatlist/",
                photos : "Lapp/openbubbles/nativeapp/ui/photos/",
        ]
        def missingJourneys = requiredJourneyOwners.findAll { journey, owner ->
            !profileRules.any { rule -> rule.contains(owner) }
        }.keySet()
        if (!missingJourneys.isEmpty()) {
            throw new GradleException(
                    "OpenBubbles Baseline Profile is missing app-owned journey coverage: " +
                    missingJourneys.join(", "),
            )
        }
        logger.lifecycle("Verified app-owned Baseline Profile coverage: startup, chats, photos")
    }
}

tasks.matching { it.name == "connectedBenchmarkReleaseAndroidTest" }.configureEach {
    dependsOn verifyAppBaselineProfile
}
