import org.gradle.api.tasks.PathSensitivity

// Compose Desktop entry point (Windows is the target; develops fine on macOS).
// Shares :db and the UniFFI bindings with the Android app; the Rust core
// loads via JNA from the host-built cdylib (rust/target/release).
plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.compose"
    id "org.jetbrains.kotlin.plugin.compose"
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation project(":db")
    implementation project(":core")
    implementation libs.objectbox.kotlin
    // ObjectBox's native library ships as separate per-OS jars that the
    // objectbox-java POM does not pull in (Android bundles it in the AAR);
    // add every desktop target so dev machines and the CI Windows build
    // both resolve `native/libobjectbox-jni-<os>.dylib|dll|so` at runtime.
    implementation libs.objectbox.macos
    implementation libs.objectbox.windows
    implementation libs.objectbox.linux

    implementation(compose.desktop.currentOs)
    implementation(compose.foundation)
    implementation(compose.material3)
    implementation(compose.materialIconsExtended)
    implementation libs.jna
    implementation libs.kotlinx.coroutines.swing
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
}

def osName = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
def archName = System.getProperty("os.arch").toLowerCase(java.util.Locale.ROOT)
def arm64 = archName == "aarch64" || archName == "arm64"
def rustLibraryName
def jnaResourcePrefix
if (osName.contains("win")) {
    rustLibraryName = "rust_lib_bluebubbles.dll"
    jnaResourcePrefix = arm64 ? "win32-aarch64" : "win32-x86-64"
} else if (osName.contains("mac")) {
    rustLibraryName = "librust_lib_bluebubbles.dylib"
    jnaResourcePrefix = arm64 ? "darwin-aarch64" : "darwin-x86-64"
} else {
    rustLibraryName = "librust_lib_bluebubbles.so"
    jnaResourcePrefix = arm64 ? "linux-aarch64" : "linux-x86-64"
}

def rustDir = rootProject.file("rust")
def rustLibrary = new File(rustDir, "target/release/${rustLibraryName}")
def generatedRustResources = layout.buildDirectory.dir("generated/rustJnaResources")
def cargoExecutable = System.getenv("CARGO") ?: "cargo"
def rustcExecutable = System.getenv("RUSTC") ?: "rustc"
def cargoVersion = providers.exec {
    commandLine cargoExecutable, "--version"
}.standardOutput.asText.map { it.trim() }
def rustcVersion = providers.exec {
    commandLine rustcExecutable, "-vV"
}.standardOutput.asText.map { it.trim() }
def cargoHome = System.getenv("CARGO_HOME") ?: new File(System.getProperty("user.home"), ".cargo").absolutePath
def globalCargoConfig = files(
        new File(cargoHome, "config.toml"),
        new File(cargoHome, "config"),
)

def buildHostRust = tasks.register("buildHostRust", Exec) {
    description = "Builds the host Rust cdylib used by desktop UniFFI/JNA"
    workingDir rustDir
    commandLine cargoExecutable, "build", "--release", "--locked"
    inputs.files(fileTree(rustDir) {
        exclude "target/**", ".git", ".git/**", ".DS_Store"
    }).withPropertyName("rustWorkspace")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree(rootProject.file("rustpush")) {
        exclude "**/target/**", "**/.git", "**/.git/**", "**/.DS_Store"
    }).withPropertyName("rustpushWorkspace")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property("cargoExecutable", cargoExecutable)
    inputs.property("cargoVersion", cargoVersion)
    inputs.property("rustcVersion", rustcVersion)
    inputs.files(globalCargoConfig)
            .withPropertyName("globalCargoConfig")
            .withPathSensitivity(PathSensitivity.NONE)
    inputs.property("cargoBuildEnvironment", providers.environmentVariablesPrefixedBy("CARGO_BUILD_"))
    inputs.property("cargoProfileEnvironment", providers.environmentVariablesPrefixedBy("CARGO_PROFILE_"))
    inputs.property("cargoTargetEnvironment", providers.environmentVariablesPrefixedBy("CARGO_TARGET_"))
    [
            "CARGO_ENCODED_RUSTFLAGS",
            "CARGO_INCREMENTAL",
            "PROTOC",
            "RUSTC",
            "RUSTC_WORKSPACE_WRAPPER",
            "RUSTC_WRAPPER",
            "RUSTFLAGS",
    ].each { variable ->
        inputs.property("environment.${variable}", providers.environmentVariable(variable).orElse(""))
    }
    outputs.file(rustLibrary)
}

def copyHostRustLibrary = tasks.register("copyHostRustLibrary", Copy) {
    dependsOn buildHostRust
    from rustLibrary
    into generatedRustResources.map { new File(it.asFile, jnaResourcePrefix) }
}

sourceSets.main.resources.srcDir(generatedRustResources)
tasks.named("processResources").configure { dependsOn copyHostRustLibrary }

def verifyHostRustResource = tasks.register("verifyHostRustResource") {
    dependsOn copyHostRustLibrary
    doLast {
        def embedded = new File(generatedRustResources.get().asFile, "${jnaResourcePrefix}/${rustLibraryName}")
        if (!embedded.isFile()) {
            throw new GradleException("Desktop Rust library was not embedded at ${embedded}")
        }
    }
}

tasks.matching {
    it.name == "run" || it.name == "createDistributable" ||
        it.name.startsWith("package") || it.name.startsWith("createRelease")
}.configureEach {
    dependsOn verifyHostRustResource
}

compose.desktop {
    application {
        mainClass = "app.openbubbles.desktop.MainKt"
        nativeDistributions {
            packageName = "OpenBubbles"
            // macOS jpackage rejects versions with a leading 0
            packageVersion = "2.0.0"
        }
    }
}

// Run with the host Rust build on the JNA path so the UniFFI smoke test
// can load the real core during development:
//   ./gradlew :desktopApp:run
tasks.matching { it.name == "run" }.configureEach {
    doFirst {
        def rustLib = rootProject.file("rust/target/release")
        if (rustLib.exists()) {
            systemProperty("jna.library.path", rustLib.absolutePath)
        }
    }
}
