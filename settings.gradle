// Gradle root for the OpenBubbles clients: Android + desktop.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            // ObjectBox publishes no plugin marker; id is plain "io.objectbox"
            if (requested.id.id == "io.objectbox") {
                useModule("io.objectbox:objectbox-gradle-plugin:5.4.2")
            }
        }
    }
}

// Versions are duplicated from gradle/libs.versions.toml on purpose: a version
// catalog cannot be consumed by the settings `plugins` block that declares it.
// Keep the two in sync when bumping.
plugins {
    id "com.android.application" version "9.3.1" apply false
    id "com.android.library" version "9.3.1" apply false
    id "org.jetbrains.kotlin.multiplatform" version "2.4.10" apply false
    id "org.jetbrains.kotlin.jvm" version "2.4.10" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.10" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "2.4.10" apply false
    id "com.android.compose.screenshot" version "0.0.1-alpha16" apply false
    id "org.jetbrains.compose" version "1.11.1" apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
    throw new GradleException(
        "OpenBubbles native builds require JDK 21 or newer; current runtime is ${JavaVersion.current()}. " +
        "Use Android Studio's bundled JBR or set JAVA_HOME to a compatible JDK and retry."
    )
}

rootProject.name = "OpenBubbles"

include ":app-native"
project(":app-native").projectDir = file("app-native")
include ":android-smsmms"
project(":android-smsmms").projectDir = file("telephony_plus/android-smsmms/library")
include ":db"
project(":db").projectDir = file("db")
include ":core"
project(":core").projectDir = file("core")
include ":desktopApp"
project(":desktopApp").projectDir = file("desktopApp")
