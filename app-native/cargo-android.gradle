// Builds the Rust cdylib for :app-native directly with Cargo and the Android NDK.

import javax.inject.Inject
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.OutputDirectory
import org.gradle.process.ExecOperations

// Gradle 9 removed Project.exec()/javaexec() from task actions. ExecOperations
// is the replacement and can only arrive by injection, so a tiny injectable
// holder is created here and captured by the task closures below.
interface CargoExecInjection {
    @Inject
    ExecOperations getExecOps()
}
def injected = project.objects.newInstance(CargoExecInjection)

// DirectoryProperty output so AGP can wire this task through
// variant.sources.jniLibs.addGeneratedSourceDirectory.
abstract class CargoAndroidJniTask extends DefaultTask {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

abstract class CheckUniffiBindingsTask extends DefaultTask {
    @Internal
    abstract DirectoryProperty getRustDirectory()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getCommittedBindings()

    @Input
    abstract Property<String> getCargoCommand()

    @Input
    abstract Property<String> getProtocCommand()

    @Input
    abstract Property<String> getHostLibraryName()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void checkBindings() {
        def rustDir = rustDirectory.get().asFile
        def cargo = cargoCommand.get()
        def protoc = protocCommand.get()
        def tmp = Files.createTempDirectory(temporaryDir.toPath(), "bindings-").toFile()

        execOperations.exec {
            workingDir rustDir
            executable cargo
            args "build", "--locked"
            if (protoc) environment "PROTOC", protoc
        }

        def libraryFile = new File(rustDir, "target/debug/${hostLibraryName.get()}")
        if (!libraryFile.isFile()) {
            throw new GradleException("Cargo produced no UniFFI metadata library: ${libraryFile}")
        }
        execOperations.exec {
            workingDir rustDir
            executable cargo
            args "run", "--locked", "--bin", "uniffi-bindgen", "generate",
                    "--library", libraryFile.absolutePath,
                    "--language", "kotlin", "--no-format",
                    "--out-dir", tmp.absolutePath
            if (protoc) environment "PROTOC", protoc
        }

        def generated = new File(tmp, "uniffi/rust_lib_bluebubbles/rust_lib_bluebubbles.kt")
        def committed = committedBindings.get().asFile
        if (!generated.isFile()) {
            throw new GradleException("bindgen produced no kotlin file in temp dir")
        }
        if (normalizeBindings(generated.text) != normalizeBindings(committed.text)) {
            throw new GradleException(
                    "UniFFI bindings are stale. Run: (cd rust && ./build-uniffi.sh)")
        }
        logger.lifecycle("UniFFI bindings up to date")
    }

    private static String normalizeBindings(String text) {
        text.replaceAll(/(?m)[ \t]+$/, "").trim()
    }
}

// Gradle 9 removed Project.buildDir.
def cargoRoot = project.layout.buildDirectory.dir("cargo-android").get().asFile

def ABI_CONFIG = [
        "arm64-v8a": [rust: "aarch64-linux-android", clang: "aarch64-linux-android", minSdk: 21],
]

def libname = "rust_lib_bluebubbles"
def manifestDir = file("../rust")
def ndkDirectory = androidComponents.sdkComponents.ndkDirectory
def ndkVersion = android.ndkVersion
def projectMinSdk = android.defaultConfig.minSdk as int
def abiFilters = android.defaultConfig.ndk.abiFilters
def cargoBinaryName = Os.isFamily(Os.FAMILY_WINDOWS) ? "cargo.exe" : "cargo"
def cargoHome = System.getenv("CARGO_HOME") ?: new File(System.getProperty("user.home"), ".cargo").absolutePath
def cargoFromHome = new File(cargoHome, "bin/${cargoBinaryName}")
def cargoExecutable = System.getenv("CARGO") ?: (cargoFromHome.isFile() ? cargoFromHome.absolutePath : cargoBinaryName)
def rustcBinaryName = Os.isFamily(Os.FAMILY_WINDOWS) ? "rustc.exe" : "rustc"
def rustcFromCargoHome = new File(cargoHome, "bin/${rustcBinaryName}")
def rustcExecutable = System.getenv("RUSTC") ?: (rustcFromCargoHome.isFile() ? rustcFromCargoHome.absolutePath : rustcBinaryName)
def cargoVersion = providers.exec {
    commandLine cargoExecutable, "--version"
}.standardOutput.asText.map { it.trim() }
def rustcVersion = providers.exec {
    commandLine rustcExecutable, "-vV"
}.standardOutput.asText.map { it.trim() }
def globalCargoConfig = files(
        new File(cargoHome, "config.toml"),
        new File(cargoHome, "config"),
)
def protocOverride = System.getenv("PROTOC")
def protocExecutable = protocOverride ?: [
        "/opt/homebrew/bin/protoc",
        "/usr/local/bin/protoc",
        "/usr/bin/protoc",
        new File(System.getProperty("user.home"), ".linuxbrew/bin/protoc").absolutePath,
        "/home/linuxbrew/.linuxbrew/bin/protoc",
].find { candidate -> candidate && new File(candidate).isFile() }
def protocVersion = protocExecutable ? providers.exec {
    commandLine protocExecutable, "--version"
}.standardOutput.asText.map { it.trim() } : ""

// Cargo already tracks its third-party registry/git dependencies in its target
// directory. Gradle needs to track the local workspace inputs around that
// target so an ordinary Android-only build can skip Cargo altogether while a
// Rust, manifest, generated-proto, certificate, or nested path-crate change
// still invalidates the JNI output. Keep target/.git trees out of the snapshot:
// this checkout's Android Cargo target alone can exceed 20 GiB.
def cargoWorkspaceInputs = files(
        fileTree(manifestDir) {
            exclude "target/**", ".git", ".git/**", ".DS_Store"
        },
        fileTree(file("../rustpush")) {
            exclude "**/target/**", "**/.git", "**/.git/**", "**/.DS_Store"
        },
)

def cargoTasksByProfile = [:]

androidComponents {
    onVariants(selector().all()) { variant ->
        def jniLibs = variant.sources.jniLibs
        if (jniLibs == null) {
            return
        }

        def buildType = variant.buildType
        // Only the debuggable app variant should carry an unoptimized Rust
        // library. Baseline Profile and Macrobenchmark variants are separate
        // Android build types, but must exercise the same release cdylib that
        // ships to users. Keying the task by Cargo profile also lets every
        // release-like Android variant reuse one native build.
        def cargoProfile = buildType == "debug" ? "debug" : "release"
        def t = cargoTasksByProfile[cargoProfile]
        if (t == null) {
        def taskName = "cargoBuild${libname.capitalize()}${cargoProfile.capitalize()}"
        t = tasks.register(taskName, CargoAndroidJniTask) {
            description = "Builds ${libname} (.so) with Cargo and the Android NDK using the ${cargoProfile} profile"
            outputDirectory.set(layout.buildDirectory.dir("cargo-android/jniLibs/${cargoProfile}"))
            inputs.files(cargoWorkspaceInputs)
                    .withPropertyName("cargoWorkspace")
                    .withPathSensitivity(PathSensitivity.RELATIVE)
            inputs.property("cargoProfile", cargoProfile)
            inputs.property("abis", abiFilters.toList().sort())
            inputs.property("minSdk", projectMinSdk)
            inputs.property("ndkVersion", ndkVersion)
            inputs.property("cargoExecutable", cargoExecutable)
            inputs.property("cargoVersion", cargoVersion)
            inputs.property("rustcVersion", rustcVersion)
            inputs.property("protocExecutable", protocExecutable ?: "")
            inputs.property("protocVersion", protocVersion)
            inputs.files(globalCargoConfig)
                    .withPropertyName("globalCargoConfig")
                    .withPathSensitivity(PathSensitivity.NONE)
            inputs.property("cargoBuildEnvironment", providers.environmentVariablesPrefixedBy("CARGO_BUILD_"))
            inputs.property("cargoProfileEnvironment", providers.environmentVariablesPrefixedBy("CARGO_PROFILE_"))
            inputs.property("cargoTargetEnvironment", providers.environmentVariablesPrefixedBy("CARGO_TARGET_"))
            [
                    "CARGO_ENCODED_RUSTFLAGS",
                    "CARGO_INCREMENTAL",
                    "PROTOC",
                    "RUSTC",
                    "RUSTC_WORKSPACE_WRAPPER",
                    "RUSTC_WRAPPER",
                    "RUSTFLAGS",
            ].each { variable ->
                inputs.property("environment.${variable}", providers.environmentVariable(variable).orElse(""))
            }

            doLast {
                def cargoOutputDir = outputDirectory.get().asFile
                def abis = abiFilters.toList()
                if (abis.isEmpty()) {
                    throw new GradleException("Set ndk.abiFilters in defaultConfig so Cargo knows which Rust targets to build")
                }

                def configs = abis.collectEntries { abi ->
                    def config = ABI_CONFIG[abi]
                    if (config == null) {
                        throw new GradleException("Unsupported ABI in ndk.abiFilters: ${abi}")
                    }
                    [(abi): config]
                }

                def ndkDir = ndkDirectory.get().asFile
                if (!new File(ndkDir, "package.xml").isFile()) {
                    throw new GradleException(
                            "Android NDK ${ndkVersion} is not installed at ${ndkDir}. " +
                            "Install package ndk;${ndkVersion} with sdkmanager.")
                }

                def isWindows = Os.isFamily(Os.FAMILY_WINDOWS)
                def hostTag = isWindows ? "windows-x86_64" :
                        (Os.isFamily(Os.FAMILY_MAC) ? "darwin-x86_64" : "linux-x86_64")
                def binarySuffix = isWindows ? ".exe" : ""
                def compilerSuffix = isWindows ? ".cmd" : ""
                def toolchainBin = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/bin")
                if (!toolchainBin.isDirectory()) {
                    throw new GradleException("Android NDK toolchain not found: ${toolchainBin}")
                }

                def clang = new File(toolchainBin, "clang${binarySuffix}")
                def clangxx = new File(toolchainBin, "clang++${binarySuffix}")
                def llvmAr = new File(toolchainBin, "llvm-ar${binarySuffix}")
                def llvmRanlib = new File(toolchainBin, "llvm-ranlib${binarySuffix}")
                for (tool in [clang, clangxx, llvmAr, llvmRanlib]) {
                    if (!tool.isFile()) throw new GradleException("Android NDK tool not found: ${tool}")
                }

                def cargoTargetDir = new File(cargoRoot, "target")
                def workaroundDir = new File(cargoRoot, "libgcc_workaround/${ndkVersion.tokenize('.').first()}")
                workaroundDir.mkdirs()
                new File(workaroundDir, "libgcc.a").text = "INPUT(-lunwind)"
                def separator = "\u001f"
                def inheritedRustFlags = System.getenv("CARGO_ENCODED_RUSTFLAGS")
                def rustFlags = (inheritedRustFlags ? inheritedRustFlags + separator : "") +
                        "-L${separator}${workaroundDir.absolutePath}"

                if (cargoOutputDir.exists()) cargoOutputDir.deleteDir()
                for (entry in configs) {
                    def abi = entry.key
                    def config = entry.value
                    def rustTarget = config.rust
                    def minSdk = Math.max(projectMinSdk, config.minSdk as int)
                    def targetArg = "--target=${config.clang}${minSdk}"
                    def targetClang = new File(toolchainBin, "${config.clang}${minSdk}-clang${compilerSuffix}")
                    if (!targetClang.isFile()) {
                        throw new GradleException("Android NDK linker not found: ${targetClang}")
                    }

                    def linkerKey = "CARGO_TARGET_${rustTarget.replace('-', '_').toUpperCase()}_LINKER"
                    def cargoArgs = ["build", "--locked", "--lib", "--target", rustTarget]
                    if (cargoProfile == "release") cargoArgs += "--release"

                    logger.lifecycle("Building ${libname} for ${abi} (${rustTarget})")
                    injected.execOps.exec {
                        workingDir manifestDir
                        executable cargoExecutable
                        args cargoArgs
                        environment "CARGO_TARGET_DIR", cargoTargetDir.absolutePath
                        environment "CARGO_ENCODED_RUSTFLAGS", rustFlags
                        if (protocExecutable) environment "PROTOC", protocExecutable
                        environment linkerKey, targetClang.absolutePath
                        environment "AR_${rustTarget}", llvmAr.absolutePath
                        environment "CC_${rustTarget}", clang.absolutePath
                        environment "CFLAGS_${rustTarget}", targetArg
                        environment "CXX_${rustTarget}", clangxx.absolutePath
                        environment "CXXFLAGS_${rustTarget}", targetArg
                        environment "RANLIB_${rustTarget}", llvmRanlib.absolutePath
                    }

                    def builtLibrary = new File(cargoTargetDir, "${rustTarget}/${cargoProfile}/lib${libname}.so")
                    if (!builtLibrary.isFile()) {
                        throw new GradleException("Cargo produced no Android library: ${builtLibrary}")
                    }
                    def outputLibrary = new File(cargoOutputDir, "${abi}/lib${libname}.so")
                    Files.createDirectories(outputLibrary.parentFile.toPath())
                    Files.copy(builtLibrary.toPath(), outputLibrary.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
            cargoTasksByProfile[cargoProfile] = t
        }

        jniLibs.addGeneratedSourceDirectory(t) { it.outputDirectory }
    }
}

// Guards against the committed UniFFI bindings drifting from the Rust
// surface. UniFFI reads exported metadata, which is profile-independent, so
// use the debug cdylib instead of paying the shipping release profile's LTO
// cost merely to regenerate Kotlin declarations.
def uniffiLibraryName
if (Os.isFamily(Os.FAMILY_WINDOWS)) {
    uniffiLibraryName = "rust_lib_bluebubbles.dll"
} else if (Os.isFamily(Os.FAMILY_MAC)) {
    uniffiLibraryName = "librust_lib_bluebubbles.dylib"
} else {
    uniffiLibraryName = "librust_lib_bluebubbles.so"
}
tasks.register("checkUniffiBindings", CheckUniffiBindingsTask) {
    rustDirectory.set(layout.projectDirectory.dir("../rust"))
    committedBindings.set(layout.projectDirectory.file(
            "../core/src/main/kotlin/uniffi/rust_lib_bluebubbles/rust_lib_bluebubbles.kt"))
    cargoCommand.set(cargoExecutable)
    protocCommand.set(protocExecutable ?: "")
    hostLibraryName.set(uniffiLibraryName)
}
