// Native (no-Dart) OpenBubbles Android app. Coexists with the Flutter app
// (:app) until the cutover milestone; dev applicationId is suffixed so both
// can be installed side by side.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "app.openbubbles.nativeapp"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.openbubbles.messaging"
        minSdk 26
        targetSdk 36
        versionCode 20002236
        versionName "2.0.0"

        // Keep in sync with installed Rust cross targets (rustup target list)
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("../android/key.properties")
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        compose true
        viewBinding true
    }
}

dependencies {
    implementation project(":shared")
    implementation project(":db")
    implementation project(":core")

    // ObjectBox native runtime for Android (entities live in :db)
    implementation "io.objectbox:objectbox-android:4.3.0"

    // Rust core via UniFFI (JNA-based bindings)
    implementation "net.java.dev.jna:jna:5.16.0@aar"

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"

    // Ported credentials/autofill subsystem (from the Flutter app's gradle)
    implementation "androidx.credentials:credentials:1.6.0-rc01"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.autofill:autofill:1.3.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.upokecenter:cbor:4.5.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // JVM unit tests for the sms/ receive->ingest builders (same objectbox
    // desktop runtime :db/:core tests use, so the ingest integration can open
    // a real store without a device).
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "io.objectbox:objectbox-java:4.3.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
}

// UniFFI-generated Kotlin bindings. Compiled in both :app and :app-native
// (each app bundles its own copy); M0.2 moves generation into :shared.
android.sourceSets.main.java.srcDir "../android/app/src/main/kotlin/uniffi"

// Build the same Rust cdylib the Flutter app uses, packaged into this APK.
// Standalone cargokit invocation (upstream plugin.gradle requires Flutter).
apply from: "cargokit-standalone.gradle"
