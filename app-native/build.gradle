// Native (no-Dart) OpenBubbles Android application.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "app.openbubbles.nativeapp"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.openbubbles.messaging"
        minSdk 26
        targetSdk 36
        versionCode 20002236
        versionName "2.0.0"

        // Keep in sync with installed Rust cross targets (rustup target list)
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("../android/key.properties")
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
    }
    def releaseStoreFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    def hasReleaseSigning = keystorePropertiesFile.exists() && releaseStoreFile?.exists()
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile releaseStoreFile
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
    if (!hasReleaseSigning) {
        logger.lifecycle("Production keystore unavailable; release variants will be debug-signed.")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        compose true
        viewBinding true
    }
}

dependencies {
    implementation project(":shared")
    implementation project(":db")
    implementation project(":core")

    // ObjectBox native runtime for Android (entities live in :db)
    implementation "io.objectbox:objectbox-android:4.3.0"

    // Rust core via UniFFI (JNA-based bindings)
    implementation "net.java.dev.jna:jna:5.16.0@aar"

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"

    // Ported credentials/autofill subsystem (from the Flutter app's gradle)
    implementation "androidx.credentials:credentials:1.6.0-rc01"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.autofill:autofill:1.3.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.upokecenter:cbor:4.5.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.activity:activity-compose:1.9.3"

    // QR pairing scanner (provisioning): CameraX + ML Kit on-device QR decode
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // JVM unit tests for the sms/ receive->ingest builders (same objectbox
    // desktop runtime :db/:core tests use, so the ingest integration can open
    // a real store without a device).
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "io.objectbox:objectbox-java:4.3.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
}

// UniFFI-generated Kotlin bindings live in :core.

// Build the same Rust cdylib the Flutter app uses, packaged into this APK.
// Standalone cargokit invocation (upstream plugin.gradle requires Flutter).
apply from: "cargokit-standalone.gradle"

// Local-only compatibility probe for the production APK's Rust library.
//
// The production binary contains OpenAbsinthe statically, so it cannot be
// linked as a normal OpenAbsinthe dependency.  For development builds we can
// still package a user-supplied copy under a distinct name and inspect its
// exported ABI on a device:
//
//   OPENBUBBLES_OFFICIAL_RUST_LIB=/path/to/librust_lib_bluebubbles.so \
//     ./gradlew :app-native:assembleDebug
//
// Nothing is downloaded and the binary is never copied into the source tree.
def officialRustLibPath = providers.environmentVariable("OPENBUBBLES_OFFICIAL_RUST_LIB").orElse("")
def officialRustJniRoot = layout.buildDirectory.dir("generated/officialRustJni/debug")

android.sourceSets.debug.jniLibs.srcDir(officialRustJniRoot)

def stageOfficialRustLibDebug = tasks.register("stageOfficialRustLibDebug", Sync) {
    def configuredPath = officialRustLibPath.get()
    inputs.property("officialRustLibPath", configuredPath)
    into(officialRustJniRoot.map { it.dir("arm64-v8a") })

    if (!configuredPath.isBlank()) {
        def suppliedLibrary = file(configuredPath)
        from(suppliedLibrary) {
            rename { "libopenbubbles_official.so" }
        }
        doFirst {
            if (!suppliedLibrary.isFile()) {
                throw new GradleException(
                    "OPENBUBBLES_OFFICIAL_RUST_LIB does not point to a file: ${suppliedLibrary}")
            }
        }
    }
}

tasks.matching { it.name == "mergeDebugJniLibFolders" }.configureEach {
    dependsOn(stageOfficialRustLibDebug)
}
