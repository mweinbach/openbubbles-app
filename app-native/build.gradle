// Native (no-Dart) OpenBubbles Android application.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    // Compose Preview Screenshot Testing is an explicit visual-review tool;
    // it is intentionally not part of routine CI.
    id "com.android.compose.screenshot"
    id "androidx.baselineprofile"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    namespace "app.openbubbles.nativeapp"
    // 37 is required by Compose 1.12 / material3 1.5.x / material3-adaptive 1.3.0.
    compileSdk 37
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.openbubbles.messaging"
        minSdk 26
        targetSdk 36
        versionCode 20002280
        versionName "3.5.2"
        manifestPlaceholders.firebaseTelemetryCollectionEnabled = "false"
        manifestPlaceholders.firebaseMessagingAutoInitEnabled = "true"
        buildConfigField "boolean", "FIREBASE_TELEMETRY_ENABLED", "false"
        buildConfigField "boolean", "PERFORMANCE_TEST", "false"

        // OpenBubbles ships to modern Android hardware only. Keeping this
        // arm64-only prevents the self-update APK from carrying a second copy
        // of every native dependency for desktop-oriented x86_64 emulators.
        ndk {
            abiFilters += ["arm64-v8a"]
        }
    }

    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("android/key.properties")
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
    }
    def releaseStoreFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    def hasReleaseSigning = keystorePropertiesFile.exists() && releaseStoreFile?.exists()
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile releaseStoreFile
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        debug {
            // Local/developer installs must not count as production users or
            // upload intentionally triggered test failures.
            manifestPlaceholders.firebaseTelemetryCollectionEnabled = "false"
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro",
            )
            // A local fallback release is useful for proving R8/packaging but
            // is not a production artifact and must not upload telemetry,
            // symbols, mappings, or register for the production FCM topic.
            manifestPlaceholders.firebaseTelemetryCollectionEnabled = hasReleaseSigning.toString()
            manifestPlaceholders.firebaseMessagingAutoInitEnabled = hasReleaseSigning.toString()
            buildConfigField "boolean", "FIREBASE_TELEMETRY_ENABLED", hasReleaseSigning.toString()
            firebaseCrashlytics {
                mappingFileUploadEnabled hasReleaseSigning
                nativeSymbolUploadEnabled hasReleaseSigning
                unstrippedNativeLibsDir file("${layout.buildDirectory.get().asFile}/cargo-android/jniLibs/release")
            }
        }
        // The Baseline Profile plugin creates these two release-like build
        // types. Customize the generated variants themselves so device
        // measurements never use production signing or emit telemetry/FCM
        // work that would both pollute results and mutate external state.
        benchmarkRelease {
            initWith release
            signingConfig signingConfigs.debug
            manifestPlaceholders.firebaseTelemetryCollectionEnabled = "false"
            manifestPlaceholders.firebaseMessagingAutoInitEnabled = "false"
            buildConfigField "boolean", "FIREBASE_TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "PERFORMANCE_TEST", "true"
            firebaseCrashlytics {
                mappingFileUploadEnabled false
                nativeSymbolUploadEnabled false
            }
        }
        nonMinifiedRelease {
            initWith release
            signingConfig signingConfigs.debug
            manifestPlaceholders.firebaseTelemetryCollectionEnabled = "false"
            manifestPlaceholders.firebaseMessagingAutoInitEnabled = "false"
            buildConfigField "boolean", "FIREBASE_TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "PERFORMANCE_TEST", "true"
            firebaseCrashlytics {
                mappingFileUploadEnabled false
                nativeSymbolUploadEnabled false
            }
        }
    }
    if (!hasReleaseSigning) {
        logger.lifecycle("Production keystore unavailable; release variants will be debug-signed.")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    // The screenshot plugin requires this here as well as in gradle.properties.
    experimentalProperties["android.experimental.enableScreenshotTest"] = true

    buildFeatures {
        compose true
        viewBinding true
        // BuildConfig.DEBUG gates the on-screen smoke-test footer.
        buildConfig true
    }

    packaging {
        resources {
            // :db is a JVM module shared with desktop, so the ObjectBox plugin
            // adds the current host runtime to its published runtime graph.
            // Android uses objectbox-android's ABI-specific JNI libraries and
            // must not ship unrelated desktop host libraries as resources.
            excludes += [
                    "native/libobjectbox-jni-macos.dylib",
                    "native/libobjectbox-jni-linux-x64.so",
                    "native/objectbox-jni-windows-x64.dll",
                    "native/objectbox-jni-windows-x86.dll",
            ]
        }
    }

    lint {
        // CredentialDependency wants credentials-play-services-auth for
        // Android 13-and-below Credential Manager *clients*. This app only
        // implements a provider service and deliberately ships without Play
        // services (self-updates come from GitHub Releases).
        // OldTargetApi: targetSdk raises are deliberate, hardware-tested
        // moves (tools/CUTOVER.md), not something lint should nag about.
        disable 'CredentialDependency', 'OldTargetApi'
    }
}

baselineProfile {
    // Profile generation is an explicit device gate, not hidden work on every
    // release build. The generated profile still drives DEX layout.
    automaticGenerationDuringBuild = false
    dexLayoutOptimization = true
}

// Firebase's transport AAR is application infrastructure, not a preview
// dependency. The alpha screenshot renderer loads its generated R classes
// twice (outer and nested) and fails every preview with an InnerClasses
// mismatch, so keep only that unused AAR off screenshot-test classpaths.
configurations.configureEach { configuration ->
    if (configuration.name.toLowerCase(Locale.ROOT).contains("screenshottest")) {
        configuration.exclude(
                group: "com.google.firebase",
                module: "firebase-datatransport",
        )
    }
}

// DateFormat and java.time use the forked JVM's defaults. Pin screenshot
// recording and validation so chat timestamps render identically on developer
// machines and Linux CI, regardless of the host's locale or timezone.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    if (name.endsWith("ScreenshotTest")) {
        systemProperty "user.language", "en"
        systemProperty "user.country", "US"
        systemProperty "user.timezone", "America/New_York"
        // alpha16 exposes the engine input directly under AGP 9.3. Keep a
        // measured 0.05% ceiling for host renderer subpixel drift.
        testEngineInput.threshold.set(0.0005f)
    }
}

kotlin {
    compilerOptions {
        // jvmTarget follows compileOptions.targetCompatibility (21).
        // Most of the Expressive surface graduated across material3 alpha15-26,
        // but LoadingIndicator, MaterialShapes/toShape(), ButtonGroup and the
        // ToggleButton size variants are still gated. The global opt-in is a
        // safety net for those rather than a blanket requirement.
        optIn.addAll(
            "androidx.compose.material3.ExperimentalMaterial3Api",
            "androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
            "androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi",
            // SharedTransitionLayout / LocalSharedTransitionScope (NavDisplay
            // shared elements) are still experimental in compose-animation.
            "androidx.compose.animation.ExperimentalSharedTransitionApi",
        )
    }
}

// Recovery-only: `-PopenAbsintheOracleJniDir=/path/to/jniLibs` adds the
// historical arm64 image to a debug APK for byte-for-byte differential tests.
// Ordinary debug/release builds do not package it.
def openAbsintheOracleJniDir = providers.gradleProperty("openAbsintheOracleJniDir").orNull
if (openAbsintheOracleJniDir) {
    androidComponents {
        onVariants(selector().withBuildType("debug")) { variant ->
            variant.sources.jniLibs.addStaticSourceDirectory(file(openAbsintheOracleJniDir).absolutePath)
        }
    }
}

dependencies {
    implementation project(":db")
    implementation project(":core")
    implementation project(":android-smsmms")

    // ObjectBox native runtime for Android (entities live in :db)
    implementation libs.objectbox.android

    // Rust core via UniFFI (JNA-based bindings). The @aar flavor is required
    // on Android, so the coordinate carries an explicit artifact suffix.
    implementation "${libs.jna.get()}@aar"

    implementation libs.androidx.core.ktx
    implementation libs.androidx.profileinstaller
    implementation libs.androidx.work.runtime.ktx

    // Ported credentials/autofill subsystem (from the Flutter app's gradle)
    implementation libs.androidx.credentials
    implementation libs.androidx.biometric
    implementation libs.androidx.autofill
    implementation libs.androidx.appcompat
    implementation libs.androidx.exifinterface
    implementation libs.google.material
    implementation libs.cbor
    implementation libs.okhttp
    implementation libs.androidx.activity.compose

    // Oversized outgoing video compression (1080p/HEVC, HDR kept) before
    // enqueue, plus the attachment viewer's video playback (ExoPlayer handles
    // QuickTime/HEVC/HDR far better than VideoView). Media3 uses platform
    // codecs only — no native libs.
    implementation libs.androidx.media3.transformer
    implementation libs.androidx.media3.effect
    implementation libs.androidx.media3.common
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui.compose

    // QR pairing scanner (provisioning): CameraX + official ML Kit Analyzer
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.androidx.camera.mlkit.vision
    implementation libs.mlkit.barcode.scanning

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    // The stable BOM intentionally does not carry Material 3 alphas. Pin the
    // Expressive surface explicitly AFTER the platform, matching AndroidX's
    // documented setup: the explicit version wins over the BOM's managed one.
    implementation libs.androidx.material3
    implementation libs.androidx.graphics.shapes

    // material3.adaptive is a DIFFERENT version train (1.3.0) from material3.
    implementation libs.androidx.adaptive
    implementation libs.androidx.adaptive.layout
    implementation libs.androidx.adaptive.navigation
    implementation libs.androidx.adaptive.navigation3

    // Navigation3 back stack + the Material list-detail scene strategy.
    implementation libs.androidx.navigation3.runtime
    implementation libs.androidx.navigation3.ui

    // MaterialShapes / RoundedPolygon / Morph. Arrives transitively via
    // material3, declared explicitly because we name the types directly.
    implementation libs.androidx.graphics.shapes

    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.navigation3
    implementation libs.kotlinx.serialization.json

    // Release-only product telemetry and diagnostics. Debug collection is
    // disabled in OpenBubblesApplication so developer runs do not inflate
    // active-user counts. FCM carries only a wake-up hint; Ledger remains the
    // signed source of truth for every update.
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.crashlytics.ndk
    implementation libs.firebase.messaging

    baselineProfile project(":benchmark")

    // JVM unit tests for the sms/ receive->ingest builders (same objectbox
    // desktop runtime :db/:core tests use, so the ingest integration can open
    // a real store without a device).
    screenshotTestImplementation libs.screenshot.validation.api

    testImplementation libs.kotlin.test
    testImplementation libs.objectbox.java
    testImplementation libs.kotlinx.coroutines.core
    testImplementation libs.kotlinx.coroutines.test
    // Self-update feed/download tests against a local HTTP server.
    testImplementation libs.okhttp.mockwebserver
}

// UniFFI-generated Kotlin bindings live in :core.

// Build the Rust UniFFI cdylib directly with Cargo and the Android NDK.
apply from: "cargo-android.gradle"

// Rabbit 1 Canary 1 asks AGP 9.3 projects for these aggregate class tasks
// during IDE builds, while AGP exposes the equivalent assemble lifecycle
// tasks. Keep the aliases guarded so a future AGP-provided task wins.
gradle.projectsEvaluated {
    [
            unitTestClasses       : "assembleUnitTest",
            androidTestClasses    : "assembleAndroidTest",
            screenshotTestClasses : "assembleScreenshotTest",
    ].each { aliasName, targetName ->
        if (tasks.findByName(aliasName) == null) {
            tasks.register(aliasName) {
                group = "build"
                description = "Compatibility alias for ${targetName} requested by Android Studio."
                dependsOn targetName
            }
        }
    }
}
