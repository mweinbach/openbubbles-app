// Builds the Rust cdylib for :app-native using cargokit's build_tool.
//
// Upstream cargokit (rust_builder/cargokit/gradle/plugin.gradle) refuses to
// apply without the Flutter Gradle plugin present — it borrows the Flutter
// app's variants and target platforms. This script drives the exact same
// run_build_tool.sh with the same environment contract, but sourced from
// THIS module's applicationVariants and ndk.abiFilters instead.
//
// Keep the env var names/values in sync with CargoKitBuildTask.build() in
// rust_builder/cargokit/gradle/plugin.gradle.

import javax.inject.Inject
import org.gradle.process.ExecOperations

// Gradle 9 removed Project.exec()/javaexec() from task actions. ExecOperations
// is the replacement and can only arrive by injection, so a tiny injectable
// holder is created here and captured by the task closures below.
interface CargokitExecInjection {
    @Inject
    ExecOperations getExecOps()
}
def injected = project.objects.newInstance(CargokitExecInjection)

def cargokitDir = file("../rust_builder/cargokit")
// Gradle 9 removed Project.buildDir.
def cargoRoot = project.layout.buildDirectory.dir("cargokit").get().asFile

// Flutter platform names used by cargokit's build_tool
def ABI_TO_PLATFORM = [
        "arm64-v8a"   : "android-arm64",
        "armeabi-v7a" : "android-arm",
        "x86"         : "android-x86",
        "x86_64"      : "android-x64",
]

def libname = "rust_lib_bluebubbles"
def manifestDir = file("../rust")

android.applicationVariants.all { variant ->
    def buildType = variant.buildType.name
    def cargoOutputDir = new File(cargoRoot, "jniLibs/${buildType}")

    def taskName = "cargokitCargoBuild${libname.capitalize()}${buildType.capitalize()}"

    def t = tasks.register(taskName) {
        description = "Builds ${libname} (.so) via cargokit for ${variant.name}"
        // Cargo's own caching makes the incremental call cheap; always re-run
        // so merged jniLibs pick up Rust changes (mirrors upstream behavior).
        outputs.upToDateWhen { false }

        doLast {
            def abis = android.defaultConfig.ndk.abiFilters.toList()
            if (abis.isEmpty()) {
                throw new GradleException("Set ndk.abiFilters in defaultConfig so cargokit knows which Rust targets to build")
            }
            def platforms = abis.collect { ABI_TO_PLATFORM[it] }
            for (p in platforms) {
                if (p == null) throw new GradleException("Unknown ABI in ndk.abiFilters")
            }

            def executableName = org.apache.tools.ant.taskdefs.condition.Os.isFamily(
                    org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS) ? "run_build_tool.cmd" : "run_build_tool.sh"

            injected.execOps.exec {
                executable new File(cargokitDir, executableName)
                args "build-gradle"
                environment "CARGOKIT_ROOT_PROJECT_DIR", project.rootProject.projectDir
                environment "CARGOKIT_TOOL_TEMP_DIR", new File(cargoRoot, "build_tool")
                environment "CARGOKIT_MANIFEST_DIR", manifestDir
                environment "CARGOKIT_CONFIGURATION", buildType
                environment "CARGOKIT_TARGET_TEMP_DIR", new File(cargoRoot, "build")
                environment "CARGOKIT_OUTPUT_DIR", cargoOutputDir
                environment "CARGOKIT_NDK_VERSION", android.ndkVersion
                environment "CARGOKIT_SDK_DIR", android.sdkDirectory
                // From SDK 37 the platform string carries a minor version
                // ("android-37.0"), which is not parseable as an int. cargokit
                // only wants the major API level.
                environment "CARGOKIT_COMPILE_SDK_VERSION",
                        android.compileSdkVersion.replace("android-", "").tokenize(".").first().toInteger()
                environment "CARGOKIT_MIN_SDK_VERSION", android.defaultConfig.minSdkVersion.apiLevel as int
                environment "CARGOKIT_TARGET_PLATFORMS", platforms.join(",")
                environment "CARGOKIT_JAVA_HOME", System.properties['java.home']
            }
        }
    }

    android.sourceSets.maybeCreate(buildType).jniLibs.srcDir(cargoOutputDir)

    // AGP 8: merge<Variant>JniLibFolders must wait for cargo
    def mergeName = "merge${variant.name.capitalize()}JniLibFolders"
    tasks.matching { it.name == mergeName }.configureEach {
        dependsOn t
    }
}

// Guards against the committed UniFFI bindings drifting from the Rust
// surface: regenerates into a temp dir and diffs. Slow (release cargo
// build); run explicitly or from CI, not part of assembleDebug.
tasks.register("checkUniffiBindings") {
    doLast {
        def tmp = File.createTempDir()
        tmp.deleteOnExit()
        injected.execOps.exec {
            workingDir file("../rust")
            executable "cargo"
            args "run", "--bin", "uniffi-bindgen", "generate",
                    "--library", "target/release/librust_lib_bluebubbles.dylib",
                    "--language", "kotlin", "--no-format",
                    "--out-dir", tmp.absolutePath
        }
        def generated = new File(tmp, "uniffi/rust_lib_bluebubbles/rust_lib_bluebubbles.kt")
        def committed = file("../core/src/main/kotlin/uniffi/rust_lib_bluebubbles/rust_lib_bluebubbles.kt")
        if (!generated.exists()) {
            throw new GradleException("bindgen produced no kotlin file in temp dir")
        }
        if (generated.text.trim() != committed.text.trim()) {
            throw new GradleException(
                "UniFFI bindings are stale. Run: (cd rust && ./build-uniffi.sh)")
        }
        logger.lifecycle("UniFFI bindings up to date")
    }
}
