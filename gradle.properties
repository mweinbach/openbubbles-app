org.gradle.jvmargs=-Xmx4096M
# Local build cache (stored under the Gradle user home, so CI's
# gradle/actions/setup-gradle cache persists it between runs).
org.gradle.caching=true
# Independent Android/Kotlin modules can execute concurrently. Cargo remains a
# single task because its two Android targets share one managed target tree.
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Built-in Kotlin is the AGP 9 default. :app-native does not apply
# org.jetbrains.kotlin.android; compiler options live on kotlin.compilerOptions.

# Enables the screenshotTest source set consumed by the
# com.android.compose.screenshot plugin (golden-image UI tests).
# The plugin still requires this project option; AGP 9 warns because it is
# experimental. Suppress that class of project-option warnings rather than
# dropping screenshot tests.
android.experimental.enableScreenshotTest=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
