org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
kotlin.code.style=official

# --- AGP 9 staged migration ------------------------------------------------
# AGP 9 defaults both of these to true. They are opted out deliberately so the
# toolchain can move to AGP 9 (required by Compose 1.12 / material3 1.5.x /
# material3-adaptive 1.3.0, all of which demand AGP 9.1+) without simultaneously
# rewriting two things that are not ours to rewrite quickly:
#
#   newDsl=false        keeps the legacy variant API alive for
#                       app-native/cargo-android.gradle (Rust/NDK build,
#                       uses android.applicationVariants) and for the vendored
#                       telephony_plus submodule (lintOptions/compileSdkVersion).
#   builtInKotlin=false keeps the org.jetbrains.kotlin.android plugin, which the
#                       new DSL rejects.
#
# Both opt-outs are removed in AGP 10. Retiring them is tracked as follow-up
# work: port the Cargo task to androidComponents.onVariants, and
# either patch or vendor the telephony_plus submodule.
android.newDsl=false
android.builtInKotlin=false

# Enables the screenshotTest source set consumed by the
# com.android.compose.screenshot plugin (golden-image UI tests).
android.experimental.enableScreenshotTest=true
