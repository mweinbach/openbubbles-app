// Gradle root for the native (no-Dart) OpenBubbles clients: Android + desktop.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            // ObjectBox publishes no plugin marker; id is plain "io.objectbox"
            if (requested.id.id == "io.objectbox") {
                useModule("io.objectbox:objectbox-gradle-plugin:4.3.0")
            }
        }
    }
}

plugins {
    id "com.android.application" version "8.11.1" apply false
    id "com.android.library" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "org.jetbrains.kotlin.multiplatform" version "2.1.0" apply false
    id "org.jetbrains.kotlin.jvm" version "2.1.0" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.0" apply false
    id "org.jetbrains.compose" version "1.8.2" apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

if (JavaVersion.current() != JavaVersion.VERSION_21) {
    throw new GradleException(
        "OpenBubbles native builds require JDK 21; current runtime is ${JavaVersion.current()}. " +
        "Set JAVA_HOME to a JDK 21 installation and retry."
    )
}

include ":shared"
project(":shared").projectDir = file("../shared")
include ":app-native"
project(":app-native").projectDir = file("../app-native")
include ":android-smsmms"
project(":android-smsmms").projectDir = file("../telephony_plus/android-smsmms/library")
include ":db"
project(":db").projectDir = file("../db")
include ":core"
project(":core").projectDir = file("../core")
include ":desktopApp"
project(":desktopApp").projectDir = file("../desktopApp")
