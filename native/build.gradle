allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build-native'
subprojects {
    // :db (ObjectBox bytecode transformer) and :desktopApp (Compose
    // packaging) only follow standard build directory paths.
    if (!(project.name in ['db', 'desktopApp'])) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
