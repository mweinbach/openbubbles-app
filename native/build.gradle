allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build-native'
subprojects {
    // :db keeps its default build dir — the ObjectBox bytecode transformer
    // for JVM projects does not follow redirected build directories.
    if (project.name != 'db') {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
