##
# Version catalog for the native (no-Dart) OpenBubbles clients.
#
# Two Material 3 version trains are in play and they are NOT the same:
#   * material3 + material3-adaptive-navigation-suite  -> "material3" (1.5.0-alpha26)
#   * material3.adaptive:adaptive*                     -> "adaptive"  (1.3.0, stable)
# Mixing them produces "cannot resolve" errors that look like typos.
#
# The stable Compose BOM never ships alphas, so material3 is pinned explicitly
# AFTER the platform() line in each module. That is the sanctioned AndroidX
# pattern, not a workaround.
##

[versions]
# --- toolchain -------------------------------------------------------------
# Kept in sync with native/settings.gradle, which declares the plugin versions
# literally: a version catalog cannot be consumed by the settings `plugins`
# block that declares it.
agp = "9.3.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"

# --- compose / material 3 expressive ---------------------------------------
composeBom = "2026.08.00"
material3 = "1.5.0-alpha26"
adaptive = "1.3.0"
navigation3 = "1.1.6"
graphicsShapes = "1.1.0"

# --- androidx --------------------------------------------------------------
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
work = "2.11.2"
camera = "1.6.1"
credentials = "1.6.0"
biometric = "1.1.0"
autofill = "1.3.0"
appcompat = "1.8.0"
materialComponents = "1.12.0"

# --- persistence / native --------------------------------------------------
objectbox = "5.4.2"
jna = "5.16.0"

# --- misc ------------------------------------------------------------------
coroutines = "1.11.0"
okhttp = "4.12.0"
cbor = "4.5.2"
mlkitBarcode = "17.3.0"
screenshotValidation = "0.0.1-alpha16"

[libraries]
# --- compose platform ------------------------------------------------------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# no version: resolved by the BOM
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- material 3 expressive (pinned, overrides the BOM on purpose) ----------
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-material3-windowsize = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3" }
androidx-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }

# --- material 3 adaptive (separate version train) --------------------------
androidx-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
androidx-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
androidx-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }
androidx-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "adaptive" }

# --- navigation ------------------------------------------------------------
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- shapes (MaterialShapes / RoundedPolygon / Morph) ----------------------
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }

# --- androidx runtime ------------------------------------------------------
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Per-NavEntry ViewModelStores for the Navigation3 back stack.
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
google-material = { module = "com.google.android.material:material", version.ref = "materialComponents" }

# --- camerax + ml kit (QR pairing) -----------------------------------------
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

# --- objectbox -------------------------------------------------------------
objectbox-android = { module = "io.objectbox:objectbox-android", version.ref = "objectbox" }
objectbox-kotlin = { module = "io.objectbox:objectbox-kotlin", version.ref = "objectbox" }
objectbox-java = { module = "io.objectbox:objectbox-java", version.ref = "objectbox" }
objectbox-macos = { module = "io.objectbox:objectbox-macos", version.ref = "objectbox" }
objectbox-windows = { module = "io.objectbox:objectbox-windows", version.ref = "objectbox" }
objectbox-linux = { module = "io.objectbox:objectbox-linux", version.ref = "objectbox" }
objectbox-gradle-plugin = { module = "io.objectbox:objectbox-gradle-plugin", version.ref = "objectbox" }

# --- native / misc ---------------------------------------------------------
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
cbor = { module = "com.upokecenter:cbor", version.ref = "cbor" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
# Provides @PreviewTest, which marks which previews the screenshot plugin runs.
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshotValidation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Navigation3 NavKeys are persisted through rememberNavBackStack, which saves
# them with kotlinx.serialization.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
objectbox = { id = "io.objectbox", version.ref = "objectbox" }
