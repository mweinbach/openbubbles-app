// Kotlin app logic for the native clients: message intake (UPushMessage ->
// ObjectBox), conversation/message repositories, send orchestration against
// the UniFFI surface. Plain kotlin-jvm like :db so Android + desktop share it.
plugins {
    id "org.jetbrains.kotlin.jvm"
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    api project(":db")

    implementation libs.objectbox.kotlin
    // Compile-only: consumers provide the platform runtime (Android uses the
    // @aar flavor, desktop the plain jar) to avoid duplicate classes.
    compileOnly libs.jna
    implementation libs.kotlinx.coroutines.core

    testImplementation libs.kotlin.test
    testImplementation libs.jna
}

// UniFFI bindings (same generated file the apps compile)
sourceSets.main.java.srcDir "src/main/kotlin/uniffi"
sourceSets.test.java.srcDir "src/test/kotlin/uniffi"
