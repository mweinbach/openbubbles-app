allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed Project.buildDir; layout.buildDirectory is the replacement.
rootProject.layout.buildDirectory.set(file('build-native'))
subprojects {
    // :db (ObjectBox bytecode transformer) and :desktopApp (Compose
    // packaging) only follow standard build directory paths.
    if (!(project.name in ['db', 'desktopApp'])) {
        project.layout.buildDirectory.set(
            rootProject.layout.buildDirectory.dir(project.name)
        )
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
