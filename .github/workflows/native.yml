on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: 'Build and upload APK/AAB/Windows artifacts'
        required: false
        default: true
        type: boolean

# Every push and PR runs the test suite only; the APK/AAB/desktop
# artifacts are built on manual dispatch (package input) — releases
# always build their own signed APK in release-update.yml. Cancel a
# superseded run when a newer commit lands on the same ref.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

name: Native (Kotlin+Rust)
jobs:
  android:
    name: Native Android APK
    runs-on: ubuntu-latest
    steps:
      # Private (nested) submodules need read-only deploy keys; see the
      # release-update.yml copy of this step for the secret inventory.
      - name: Grant submodule read access (read-only deploy keys)
        env:
          KEY_RUSTPUSH: ${{ secrets.SUBMODULE_KEY_RUSTPUSH }}
          KEY_TELEPHONY: ${{ secrets.SUBMODULE_KEY_TELEPHONY }}
          KEY_APIS: ${{ secrets.SUBMODULE_KEY_APIS }}
          KEY_ABSINTHE: ${{ secrets.SUBMODULE_KEY_ABSINTHE }}
          KEY_CLEARADI: ${{ secrets.SUBMODULE_KEY_CLEARADI }}
          KEY_SMSMMS: ${{ secrets.SUBMODULE_KEY_SMSMMS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat <<'ALIASES' | while IFS='|' read -r alias keyvar repo; do
          github-rustpush|KEY_RUSTPUSH|mweinbach/rustpush-private
          github-telephony|KEY_TELEPHONY|mweinbach/telephony_plus
          github-apis|KEY_APIS|mweinbach/apple-private-apis-private
          github-absinthe|KEY_ABSINTHE|mweinbach/openabsinthe-private
          github-clearadi|KEY_CLEARADI|mweinbach/clearadi-private
          github-smsmms|KEY_SMSMMS|mweinbach/android-smsmms
          ALIASES
            key="${!keyvar}"
            if [ -z "$key" ]; then echo "missing secret $keyvar" >&2; exit 1; fi
            printf '%s\n' "$key" > ~/.ssh/id_$alias
            chmod 600 ~/.ssh/id_$alias
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile ~/.ssh/id_$alias"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            git config --global \
              url."ssh://$alias/$repo.git".insteadOf "https://github.com/$repo.git"
          done

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Caches the Gradle user home (wrapper, dependency cache, local build
      # cache from org.gradle.caching=true) between runs. cache-read-only
      # must be false: CI also runs for non-default branches, and the action
      # only writes caches from the default branch otherwise.
      # Pinned to v5 (Node 24) rather than v6: v6 swaps in a new caching
      # provider; v5 keeps the actions/cache-backed behavior we rely on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      # apt instead of arduino/setup-protoc: the action still targets the
      # deprecated Node 20 runtime (same approach as release-update.yml).
      # GitHub-releases binary first (runner-to-GitHub is fast and reliable;
      # slow Ubuntu mirrors have repeatedly blown the apt path's budget),
      # apt as the fallback.
      - name: Install Protobuf compiler
        timeout-minutes: 8
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            if curl -fsSL --retry 5 --retry-all-errors -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip; then
              sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
            else
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                update -qq
              sudo apt-get -o Acquire::Retries=3 install -y protobuf-compiler
            fi
          fi
          protoc --version

      # The NDK must match ndkVersion in app-native/build.gradle; without a
      # cache AGP re-downloads ~2 GB every run. Absolute path: runner env
      # vars like ANDROID_HOME are not visible in `with:` expressions.
      # Only packaging cross-compiles Rust, so skip entirely for test runs.
      - name: Cache Android NDK
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ${{ runner.os }}-ndk-28.2.13676358

      # Cargo registry/git checkouts plus the host target dirs (rustpush unit
      # tests, UniFFI check). restore-keys keep stale-but-useful deps when
      # lockfiles move; Cargo rebuilds only what changed.
      - name: Cache Cargo registry and host builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rustpush/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('rust/Cargo.lock', 'rustpush/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-

      # The Android cdylib builds (2 ABIs x debug/release) via
      # app-native/cargo-android.gradle with CARGO_TARGET_DIR here.
      # Unused on test-only runs; also avoids re-saving a cache whose
      # target dir the cross-builds never populated.
      - name: Cache Android Cargo builds
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/cache@v5
        with:
          path: build-native/app-native/cargo-android/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock', 'rustpush/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Set up fake Fairplay keys
        run: |
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )
          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Point the native build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > native/local.properties

      - name: Rust library tests
        run: cargo test --manifest-path rustpush/Cargo.toml --lib --locked

      - name: Native JVM tests + model parity + lint
        run: |
          cd native
          ./gradlew :db:test :core:test :app-native:testDebugUnitTest \
            :db:checkModelParity :app-native:lintDebug \
            :app-native:checkUniffiBindings :app-native:validateDebugScreenshotTest \
            --console=plain

      # Packaging pulls the Rust Android cross-builds (2 ABIs x debug/release)
      # through mergeJniLibFolders — the expensive half of the job — so it
      # runs only when artifacts were explicitly requested.
      - name: Android artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: |
          cd native
          ./gradlew :app-native:assembleDebug :app-native:bundleRelease --console=plain

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.package
        with:
          name: native-alpha-debug-apk
          path: build-native/app-native/outputs/apk/debug/app-native-debug.apk

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.package
        with:
          name: native-alpha-release-aab-debug-signed
          path: build-native/app-native/outputs/bundle/release/app-native-release.aab

  desktop-windows:
    name: Native Desktop (Windows)
    runs-on: windows-latest
    steps:
      # Same deploy-key dance as the android job; bash for the indirect
      # variable expansion. Windows needs absolute paths everywhere:
      # actions/checkout temporarily overrides HOME while it runs git, so
      # ssh cannot find ~/.ssh/config (Git for Windows resolves ~ from HOME).
      # Baking absolute paths into IdentityFile and core.sshCommand keeps the
      # host aliases resolvable during the submodule clone.
      - name: Grant submodule read access (read-only deploy keys)
        shell: bash
        env:
          KEY_RUSTPUSH: ${{ secrets.SUBMODULE_KEY_RUSTPUSH }}
          KEY_TELEPHONY: ${{ secrets.SUBMODULE_KEY_TELEPHONY }}
          KEY_APIS: ${{ secrets.SUBMODULE_KEY_APIS }}
          KEY_ABSINTHE: ${{ secrets.SUBMODULE_KEY_ABSINTHE }}
          KEY_CLEARADI: ${{ secrets.SUBMODULE_KEY_CLEARADI }}
          KEY_SMSMMS: ${{ secrets.SUBMODULE_KEY_SMSMMS }}
        run: |
          mkdir -p ~/.ssh
          sshhome="$HOME"
          if command -v cygpath >/dev/null 2>&1; then
            sshhome="$(cygpath -m "$HOME")"
          fi
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat <<'ALIASES' | while IFS='|' read -r alias keyvar repo; do
          github-rustpush|KEY_RUSTPUSH|mweinbach/rustpush-private
          github-telephony|KEY_TELEPHONY|mweinbach/telephony_plus
          github-apis|KEY_APIS|mweinbach/apple-private-apis-private
          github-absinthe|KEY_ABSINTHE|mweinbach/openabsinthe-private
          github-clearadi|KEY_CLEARADI|mweinbach/clearadi-private
          github-smsmms|KEY_SMSMMS|mweinbach/android-smsmms
          ALIASES
            key="${!keyvar}"
            if [ -z "$key" ]; then echo "missing secret $keyvar" >&2; exit 1; fi
            printf '%s\n' "$key" > ~/.ssh/id_$alias
            chmod 600 ~/.ssh/id_$alias
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile $sshhome/.ssh/id_$alias"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            git config --global \
              url."ssh://$alias/$repo.git".insteadOf "https://github.com/$repo.git"
          done
          git config --global core.sshCommand \
            "ssh -F $sshhome/.ssh/config -o UserKnownHostsFile=$sshhome/.ssh/known_hosts"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # v5 rather than v6 for the same caching-provider reason as the
      # android job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # choco instead of arduino/setup-protoc: the action still targets the
      # deprecated Node 20 runtime.
      - name: Install Protobuf compiler
        timeout-minutes: 10
        shell: bash
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            choco install protoc -y --no-progress
          fi
          protoc --version

      # rustpush include_bytes!()s these at compile time, so the host Rust
      # build needs the placeholders just like the android job.
      - name: Set up fake Fairplay keys
        shell: bash
        run: |
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )
          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: DB model parity (no Android SDK needed)
        run: |
          cd native
          ./gradlew.bat :db:checkModelParity --console=plain

      - name: Package Windows distributable
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: cd native; ./gradlew.bat :desktopApp:verifyHostRustResource :desktopApp:createDistributable --console=plain

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.package
        with:
          name: native-desktop-windows
          path: build-native/desktopApp/compose/binaries/main/*
