on:
  push:
    branches: [ main ]
  pull_request:
name: Native (Kotlin+Rust)
jobs:
  android:
    name: Native Android APK
    runs-on: ubuntu-latest
    steps:
      # Private (nested) submodules need read-only deploy keys; see the
      # release-update.yml copy of this step for the secret inventory.
      - name: Grant submodule read access (read-only deploy keys)
        env:
          KEY_RUSTPUSH: ${{ secrets.SUBMODULE_KEY_RUSTPUSH }}
          KEY_TELEPHONY: ${{ secrets.SUBMODULE_KEY_TELEPHONY }}
          KEY_APIS: ${{ secrets.SUBMODULE_KEY_APIS }}
          KEY_ABSINTHE: ${{ secrets.SUBMODULE_KEY_ABSINTHE }}
          KEY_SMSMMS: ${{ secrets.SUBMODULE_KEY_SMSMMS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat <<'ALIASES' | while IFS='|' read -r alias keyvar repo; do
          github-rustpush|KEY_RUSTPUSH|mweinbach/rustpush-private
          github-telephony|KEY_TELEPHONY|mweinbach/telephony_plus
          github-apis|KEY_APIS|mweinbach/apple-private-apis-private
          github-absinthe|KEY_ABSINTHE|mweinbach/openabsinthe-private
          github-smsmms|KEY_SMSMMS|mweinbach/android-smsmms
          ALIASES
            key="${!keyvar}"
            if [ -z "$key" ]; then echo "missing secret $keyvar" >&2; exit 1; fi
            printf '%s\n' "$key" > ~/.ssh/id_$alias
            chmod 600 ~/.ssh/id_$alias
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile ~/.ssh/id_$alias"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            git config --global \
              url."ssh://$alias/$repo.git".insteadOf "https://github.com/$repo.git"
          done

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Caches the Gradle user home (wrapper, dependency cache, local build
      # cache from org.gradle.caching=true) between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install Protobuf compiler
        uses: arduino/setup-protoc@v3

      # The NDK must match ndkVersion in app-native/build.gradle; without a
      # cache AGP re-downloads ~2 GB every run.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: ${{ runner.os }}-ndk-28.2.13676358

      # Cargo registry/git checkouts plus the host target dirs (rustpush unit
      # tests, UniFFI check). restore-keys keep stale-but-useful deps when
      # lockfiles move; Cargo rebuilds only what changed.
      - name: Cache Cargo registry and host builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rustpush/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('rust/Cargo.lock', 'rustpush/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-

      # The Android cdylib builds (2 ABIs x debug/release) via
      # app-native/cargo-android.gradle with CARGO_TARGET_DIR here.
      - name: Cache Android Cargo builds
        uses: actions/cache@v4
        with:
          path: build-native/app-native/cargo-android/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock', 'rustpush/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Set up fake Fairplay keys
        run: |
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )
          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Point the native build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > native/local.properties

      - name: Rust library tests
        run: cargo test --manifest-path rustpush/Cargo.toml --lib --locked

      - name: Native JVM tests + model parity + lint + Android artifacts
        run: |
          cd native
          ./gradlew :db:test :core:test :app-native:testDebugUnitTest \
            :db:checkModelParity :app-native:lintDebug \
            :app-native:checkUniffiBindings :app-native:validateDebugScreenshotTest \
            :app-native:assembleDebug :app-native:bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: native-alpha-debug-apk
          path: build-native/app-native/outputs/apk/debug/app-native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: native-alpha-release-aab-debug-signed
          path: build-native/app-native/outputs/bundle/release/app-native-release.aab

  desktop-windows:
    name: Native Desktop (Windows)
    runs-on: windows-latest
    steps:
      # Same deploy-key dance as the android job; bash for the indirect
      # variable expansion.
      - name: Grant submodule read access (read-only deploy keys)
        shell: bash
        env:
          KEY_RUSTPUSH: ${{ secrets.SUBMODULE_KEY_RUSTPUSH }}
          KEY_TELEPHONY: ${{ secrets.SUBMODULE_KEY_TELEPHONY }}
          KEY_APIS: ${{ secrets.SUBMODULE_KEY_APIS }}
          KEY_ABSINTHE: ${{ secrets.SUBMODULE_KEY_ABSINTHE }}
          KEY_SMSMMS: ${{ secrets.SUBMODULE_KEY_SMSMMS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat <<'ALIASES' | while IFS='|' read -r alias keyvar repo; do
          github-rustpush|KEY_RUSTPUSH|mweinbach/rustpush-private
          github-telephony|KEY_TELEPHONY|mweinbach/telephony_plus
          github-apis|KEY_APIS|mweinbach/apple-private-apis-private
          github-absinthe|KEY_ABSINTHE|mweinbach/openabsinthe-private
          github-smsmms|KEY_SMSMMS|mweinbach/android-smsmms
          ALIASES
            key="${!keyvar}"
            if [ -z "$key" ]; then echo "missing secret $keyvar" >&2; exit 1; fi
            printf '%s\n' "$key" > ~/.ssh/id_$alias
            chmod 600 ~/.ssh/id_$alias
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile ~/.ssh/id_$alias"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            git config --global \
              url."ssh://$alias/$repo.git".insteadOf "https://github.com/$repo.git"
          done

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf compiler
        uses: arduino/setup-protoc@v3

      - name: DB model parity (no Android SDK needed)
        run: |
          cd native
          ./gradlew.bat :db:checkModelParity --console=plain

      - name: Package Windows distributable
        run: cd native; ./gradlew.bat :desktopApp:verifyHostRustResource :desktopApp:createDistributable --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: native-desktop-windows
          path: build-native/desktopApp/compose/binaries/main/*
