# Builds the production-signed release APK and publishes it to Update Ledger.
# Version 3.4.7 is the final bridge release also published to GitHub Releases;
# 3.5.0 and newer exist only in Ledger. The installed client consumes Ledger's
# Sparkle appcast directly and has no GitHub update fallback.
#
# Signing material lives in repository secrets (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); the keystore itself is never
# committed. The two private submodules are cloned with per-repository
# read-only deploy keys (SUBMODULE_KEY_RUSTPUSH, SUBMODULE_KEY_TELEPHONY).
#
# Releases are gated on a deliberate version bump: pushes to main publish
# only when versionName or versionCode in app-native/build.gradle changed in
# that push (see the `version` job); manual workflow_dispatch runs always
# publish. versionCode: gradle's versionCode is a floor; each release uses
# max(gradle versionCode, latest published versionCode + 1) so a bumped
# version still produces a strictly newer update. versionName comes from
# gradle; when CI auto-increments the code beyond it, the release display
# name becomes "<versionName> (build <code>)".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (overrides the commit log)'
        required: false
        default: ''

name: Self-update release

permissions:
  contents: write

concurrency:
  group: self-update-release
  cancel-in-progress: false

jobs:
  # Publishes happen on a human decision, not on every green main: a push
  # releases only when it changed versionName/versionCode in
  # app-native/build.gradle. Manual dispatches always release.
  version:
    name: Version bump check
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether to release
        id: gate
        run: |
          decide() { echo "release=$1" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "manual dispatch: releasing"
            decide true
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no before-SHA on this push: releasing"
            decide true
            exit 0
          fi
          OLD_NAME=$(git show "$BEFORE:app-native/build.gradle" | sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' | head -1)
          OLD_CODE=$(git show "$BEFORE:app-native/build.gradle" | sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' | head -1)
          NEW_NAME=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app-native/build.gradle | head -1)
          NEW_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' app-native/build.gradle | head -1)
          echo "before: $OLD_NAME ($OLD_CODE) -> after: $NEW_NAME ($NEW_CODE)"
          if [ "$OLD_NAME" = "$NEW_NAME" ] && [ "$OLD_CODE" = "$NEW_CODE" ]; then
            echo "version unchanged: skipping release"
            decide false
          else
            echo "version changed: releasing"
            decide true
          fi

  native_validation:
    name: Require successful exact-head native CI
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.validation.outputs.run_id }}
      run_attempt: ${{ steps.validation.outputs.run_attempt }}
    steps:
      - name: Wait for Native (Kotlin+Rust) on the release commit
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          VALIDATION_TIMEOUT_SECONDS: '2400'
          VALIDATION_POLL_SECONDS: '15'
        run: |
          set -euo pipefail
          deadline=$((SECONDS + VALIDATION_TIMEOUT_SECONDS))

          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! runs=$(gh api \
              "repos/$RELEASE_REPOSITORY/actions/workflows/native.yml/runs?head_sha=$RELEASE_SHA&per_page=100"); then
              echo "Native workflow lookup failed; retrying until the validation deadline" >&2
              sleep "$VALIDATION_POLL_SECONDS"
              continue
            fi

            candidate=$(printf '%s\n' "$runs" | jq -ce --arg sha "$RELEASE_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.event == "push" or .event == "workflow_dispatch")]
              | sort_by(.run_started_at // .created_at // "", .run_attempt // 1, .id)
              | last // empty
            ') || {
              if ! printf '%s\n' "$runs" | jq -e '.workflow_runs | type == "array"' >/dev/null; then
                echo "Native workflow lookup returned malformed run data" >&2
                exit 1
              fi
              echo "Native validation for $RELEASE_SHA is not indexed yet"
              sleep "$VALIDATION_POLL_SECONDS"
              continue
            }

            run_id=$(printf '%s\n' "$candidate" | jq -r '.id')
            listed_attempt=$(printf '%s\n' "$candidate" | jq -r '.run_attempt // 1')
            if ! current=$(gh api "repos/$RELEASE_REPOSITORY/actions/runs/$run_id"); then
              echo "Native run $run_id could not be refreshed; retrying" >&2
              sleep "$VALIDATION_POLL_SECONDS"
              continue
            fi

            if ! printf '%s\n' "$current" | jq -e \
              --arg sha "$RELEASE_SHA" \
              --argjson id "$run_id" '
                .id == $id
                and .head_sha == $sha
                and (.path | startswith(".github/workflows/native.yml"))
                and (.event == "push" or .event == "workflow_dispatch")
              ' >/dev/null; then
              echo "Native validation run $run_id does not belong to release commit $RELEASE_SHA" >&2
              exit 1
            fi

            run_attempt=$(printf '%s\n' "$current" | jq -r '.run_attempt // 1')
            status=$(printf '%s\n' "$current" | jq -r '.status')
            conclusion=$(printf '%s\n' "$current" | jq -r '.conclusion // "pending"')
            if [ "$run_attempt" != "$listed_attempt" ]; then
              echo "Native run $run_id advanced from attempt $listed_attempt to $run_attempt; refreshing"
            elif [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Native validation run $run_id attempt $run_attempt ended with $conclusion" >&2
                exit 1
              fi
              echo "Validated release commit $RELEASE_SHA with Native run $run_id attempt $run_attempt"
              {
                echo "run_id=$run_id"
                echo "run_attempt=$run_attempt"
              } >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Native run $run_id attempt $run_attempt is $status; waiting"
            fi

            sleep "$VALIDATION_POLL_SECONDS"
          done

          echo "Timed out waiting for successful Native CI on release commit $RELEASE_SHA" >&2
          exit 1

  release:
    name: Build & publish update
    needs: [version, native_validation]
    if: needs.version.outputs.release == 'true' && needs.native_validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Must run before checkout: six private repositories are pulled in as
      # (nested) submodules — rustpush, telephony_plus, apple-private-apis,
      # open-absinthe, clearadi, android-smsmms — and GITHUB_TOKEN only sees
      # this repo.
      # GitHub allows a deploy key on a single repository, so each gets its
      # own read-only key plus an SSH host alias.
      - name: Grant submodule read access (read-only deploy keys)
        env:
          KEY_RUSTPUSH: ${{ secrets.SUBMODULE_KEY_RUSTPUSH }}
          KEY_TELEPHONY: ${{ secrets.SUBMODULE_KEY_TELEPHONY }}
          KEY_APIS: ${{ secrets.SUBMODULE_KEY_APIS }}
          KEY_ABSINTHE: ${{ secrets.SUBMODULE_KEY_ABSINTHE }}
          KEY_CLEARADI: ${{ secrets.SUBMODULE_KEY_CLEARADI }}
          KEY_SMSMMS: ${{ secrets.SUBMODULE_KEY_SMSMMS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # alias|env var with the key|repository (owner/name)
          cat <<'ALIASES' | while IFS='|' read -r alias keyvar repo; do
          github-rustpush|KEY_RUSTPUSH|mweinbach/rustpush-private
          github-telephony|KEY_TELEPHONY|mweinbach/telephony_plus
          github-apis|KEY_APIS|mweinbach/apple-private-apis-private
          github-absinthe|KEY_ABSINTHE|mweinbach/openabsinthe-private
          github-clearadi|KEY_CLEARADI|mweinbach/clearadi-private
          github-smsmms|KEY_SMSMMS|mweinbach/android-smsmms
          ALIASES
            key="${!keyvar}"
            if [ -z "$key" ]; then echo "missing secret $keyvar" >&2; exit 1; fi
            printf '%s\n' "$key" > ~/.ssh/id_$alias
            chmod 600 ~/.ssh/id_$alias
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile ~/.ssh/id_$alias"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            git config --global \
              url."ssh://$alias/$repo.git".insteadOf "https://github.com/$repo.git"
          done

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify release-note shell safety
        run: node --test scripts/release-workflow-security.test.mjs

      - name: Validate Update Ledger publication access
        env:
          UPDATE_LEDGER_API_KEY: ${{ secrets.UPDATE_LEDGER_API_KEY }}
        run: test -n "$UPDATE_LEDGER_API_KEY" || { echo "missing UPDATE_LEDGER_API_KEY repository secret" >&2; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Caches the Gradle user home (wrapper, dependency cache, local build
      # cache from org.gradle.caching=true) between runs. cache-read-only
      # must be false: releases are dispatched from m4-cutover, and the
      # action only writes caches from the default branch otherwise.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # GitHub-releases binary first (runner-to-GitHub is fast and reliable;
      # slow Ubuntu mirrors have repeatedly blown the apt path's budget),
      # apt as the fallback.
      - name: Install Protobuf compiler
        timeout-minutes: 8
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            if curl -fsSL --retry 5 --retry-all-errors -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip; then
              sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
            else
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                update -qq
              sudo apt-get -o Acquire::Retries=3 install -y protobuf-compiler
            fi
          fi
          protoc --version

      # The NDK must match ndkVersion in app-native/build.gradle; without a
      # cache AGP re-downloads ~2 GB every run. Absolute path: runner env
      # vars like ANDROID_HOME are not visible in `with:` expressions.
      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ${{ runner.os }}-ndk-28.2.13676358

      # Cargo registry/git checkouts plus the host target dirs (rustpush unit
      # tests, UniFFI check). Unique primary key so this run can save;
      # restore-keys prefix-matches the newest previous cache (GitHub cache
      # is write-once). Prefix still matches older lockfile-hash keys.
      - name: Restore Cargo registry and host builds
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rustpush/target
          key: ${{ runner.os }}-cargo-host-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-

      # The Android arm64 cdylib builds (debug/release) via
      # app-native/cargo-android.gradle with CARGO_TARGET_DIR here.
      - name: Restore Android Cargo builds
        uses: actions/cache/restore@v5
        with:
          path: build-native/app-native/cargo-android/target
          key: ${{ runner.os }}-cargo-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Set up fake Fairplay keys
        run: |
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )
          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Point the native build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compute release version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GRADLE_NAME=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app-native/build.gradle | head -1)
          GRADLE_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' app-native/build.gradle | head -1)
          [ -n "$GRADLE_NAME" ] && [ -n "$GRADLE_CODE" ] || { echo "cannot read version from app-native/build.gradle" >&2; exit 1; }
          case "$GRADLE_CODE" in ''|*[!0-9]*) echo "versionCode is not numeric: $GRADLE_CODE" >&2; exit 1 ;; esac

          PUBLISH_GITHUB=$(python3 - "$GRADLE_NAME" <<'PY'
          import re
          import sys
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if not match:
              raise SystemExit("versionName must be MAJOR.MINOR.PATCH")
          print("true" if tuple(map(int, match.groups())) <= (3, 4, 7) else "false")
          PY
          )

          LEDGER_URL="https://update-ledger.mweinbach.chatgpt.site/api/v1/update/openbubbles?channel=stable&current=0&build=0"
          LEDGER_CODE=0
          LEDGER_NAME=""
          LEDGER_REVISION=""
          if curl -fsS "$LEDGER_URL" > ledger-latest.json; then
            LEDGER_CODE=$(jq -r '.manifest.versionCode // 0' ledger-latest.json)
            LEDGER_NAME=$(jq -r '.manifest.versionName // empty' ledger-latest.json)
            LEDGER_REVISION=$(jq -r '.release.sourceRevision // empty' ledger-latest.json)
          fi
          case "$LEDGER_CODE" in ''|*[!0-9]*) LEDGER_CODE=0 ;; esac

          # Re-running a commit already accepted by Ledger republishes that
          # exact build instead of consuming another Android versionCode.
          CODE=""
          if [ "$LEDGER_NAME" = "$GRADLE_NAME" ] && [ "$LEDGER_REVISION" = "$GITHUB_SHA" ]; then
            CODE="$LEDGER_CODE"
            echo "reusing Ledger build $CODE already published for commit $GITHUB_SHA"
          fi

          # The 3.4.7 bridge can also recover from a Ledger failure after its
          # GitHub mirror was published.
          if [ -z "$CODE" ] && [ "$PUBLISH_GITHUB" = true ] && \
              gh api "repos/${{ github.repository }}/releases?per_page=30" > recent-releases.json 2>/dev/null; then
            SAME_ASSET=$(jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.target_commitish == $sha) | .assets[] | select(.name == "update.json") | .url][0] // empty' \
              recent-releases.json)
            if [ -n "$SAME_ASSET" ]; then
              gh api "$SAME_ASSET" -H "Accept: application/octet-stream" > same-update.json
              SAME_NAME=$(jq -r '.versionName // empty' same-update.json)
              SAME_CODE=$(jq -r '.versionCode // empty' same-update.json)
              case "$SAME_CODE" in ''|*[!0-9]*) SAME_CODE="" ;; esac
              if [ "$SAME_NAME" = "$GRADLE_NAME" ] && [ -n "$SAME_CODE" ]; then
                CODE="$SAME_CODE"
                echo "reusing build $CODE already published for commit $GITHUB_SHA"
              fi
            fi
          fi

          # Allocate after the greatest build known to either destination.
          if [ -z "$CODE" ]; then
            GITHUB_CODE=0
            if [ "$PUBLISH_GITHUB" = true ] && \
                gh api "repos/${{ github.repository }}/releases/latest" > latest-release.json 2>/dev/null; then
              PREV_ASSET=$(jq -r '[.assets[] | select(.name == "update.json") | .url][0] // empty' latest-release.json)
              if [ -n "$PREV_ASSET" ]; then
                GITHUB_CODE=$(gh api "$PREV_ASSET" -H "Accept: application/octet-stream" | jq -r '.versionCode')
              fi
            fi
            case "$GITHUB_CODE" in ''|*[!0-9]*) GITHUB_CODE=0 ;; esac
            [ "$LEDGER_CODE" -gt "$GITHUB_CODE" ] && PREV="$LEDGER_CODE" || PREV="$GITHUB_CODE"
            [ "$PREV" -lt "$GRADLE_CODE" ] && CODE="$GRADLE_CODE" || CODE=$((PREV + 1))
          fi

          # Stamp the build (runner-local; gradle stays the floor for humans).
          sed -i "s/^[[:space:]]*versionCode .*/        versionCode $CODE/" app-native/build.gradle
          if [ "$CODE" -eq "$GRADLE_CODE" ]; then
            DISPLAY="$GRADLE_NAME"
          else
            DISPLAY="$GRADLE_NAME (build $CODE)"
          fi

          {
            echo "version_name=$GRADLE_NAME"
            echo "version_code=$CODE"
            echo "tag=v${GRADLE_NAME}-${CODE}"
            echo "display=$DISPLAY"
            echo "asset=openbubbles-${GRADLE_NAME}-${CODE}.apk"
            echo "publish_github=$PUBLISH_GITHUB"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Google Maps release key is configured
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "missing GOOGLE_MAPS_API_KEY repository secret" >&2
            exit 1
          fi

      - name: Build signed release APK
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew :app-native:assembleRelease :app-native:uploadCrashlyticsSymbolFileRelease --console=plain

      - name: Verify Google Maps is enabled in the signed build
        run: |
          BUILD_CONFIG="build-native/app-native/generated/source/buildConfig/release/app/openbubbles/nativeapp/BuildConfig.java"
          if ! grep -Eq 'GOOGLE_MAPS_CONFIGURED[[:space:]]*=[[:space:]]*true;' "$BUILD_CONFIG"; then
            echo "signed release was built without its Google Maps configuration" >&2
            exit 1
          fi

      - name: Save Cargo registry and host builds
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rustpush/target
          key: ${{ runner.os }}-cargo-host-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Android Cargo builds
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: build-native/app-native/cargo-android/target
          key: ${{ runner.os }}-cargo-android-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage assets and write update feed
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.inputs.notes || '' }}
          PRODUCTION_SIGNER_SHA256: 285c66e5e2c693dbfa53fb86f0cd7b0bb85ead139cf3cdb5f617bed7be402604
        run: |
          set -euo pipefail
          APK_IN="build-native/app-native/outputs/apk/release/app-native-release.apk"
          [ -f "$APK_IN" ] || { echo "release APK missing at $APK_IN" >&2; exit 1; }
          cp "$APK_IN" "${{ steps.ver.outputs.asset }}"

          # A valid debug or replacement signature is still not our production
          # identity. Require exactly one signer and pin its SHA-256 digest.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          "$BT/apksigner" verify --print-certs "${{ steps.ver.outputs.asset }}" | tee certs.txt
          SIGNER_DIGESTS=$(awk -F 'certificate SHA-256 digest:' '
            NF > 1 {
              digest = $NF
              gsub(/[[:space:]:]/, "", digest)
              print tolower(digest)
            }
          ' certs.txt)
          SIGNER_COUNT=$(printf '%s\n' "$SIGNER_DIGESTS" | awk 'NF { count++ } END { print count + 0 }')
          if [ "$SIGNER_COUNT" -ne 1 ] || [ "$SIGNER_DIGESTS" != "$PRODUCTION_SIGNER_SHA256" ]; then
            echo "APK signing identity mismatch: expected exactly one production signer $PRODUCTION_SIGNER_SHA256" >&2
            exit 1
          fi
          echo "Verified production signing certificate SHA-256: $PRODUCTION_SIGNER_SHA256"

          SHA256=$(shasum -a 256 "${{ steps.ver.outputs.asset }}" | awk '{print $1}')
          BYTES=$(wc -c < "${{ steps.ver.outputs.asset }}" | tr -d ' ')
          {
            echo "sha256=$SHA256"
            echo "bytes=$BYTES"
          } >> "$GITHUB_OUTPUT"

          # Release notes, in order of preference:
          #   1. workflow_dispatch `notes` input
          #   2. the `## v<versionName>` section of assets/changelog/changelog.md
          #      (kept current for each release; this is the documented path)
          #   3. the commit log since the previous release tag
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          else
            python3 scripts/extract-release-notes.py \
              "${{ steps.ver.outputs.version_name }}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "$PREV_TAG..HEAD" > release-notes.md
            else
              git log --oneline -20 > release-notes.md
            fi
          fi

          if [ "${{ steps.ver.outputs.publish_github }}" = true ]; then
            python3 scripts/update-feed.py \
              --code "${{ steps.ver.outputs.version_code }}" \
              --display "${{ steps.ver.outputs.display }}" \
              --asset "${{ steps.ver.outputs.asset }}" \
              --sha256 "$SHA256" \
              --bytes "$BYTES" \
              --notes-file release-notes.md > update.json
            cat update.json
          fi

      - name: Publish final GitHub bridge release
        if: steps.ver.outputs.publish_github == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.ver.outputs.asset }}" update.json \
              --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "OpenBubbles ${{ steps.ver.outputs.display }}" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              "${{ steps.ver.outputs.asset }}" update.json \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "OpenBubbles ${{ steps.ver.outputs.display }}" \
              --notes-file release-notes.md
          fi

      - name: Publish Update Ledger artifact and feeds
        env:
          UPDATE_LEDGER_BASE_URL: https://update-ledger.mweinbach.chatgpt.site
