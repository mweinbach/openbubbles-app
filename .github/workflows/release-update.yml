# Builds the production-signed release APK and publishes it as a self-update
# GitHub Release (APK + update.json feed). Devices running the app pick the
# release up through the in-app updater (app-native .../update/).
#
# Signing material lives in repository secrets (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); the keystore itself is never
# committed. The two private submodules are cloned with per-repository
# read-only deploy keys (SUBMODULE_KEY_RUSTPUSH, SUBMODULE_KEY_TELEPHONY).
#
# Releases are gated on a deliberate version bump: pushes to main publish
# only when versionName or versionCode in app-native/build.gradle changed in
# that push (see the `version` job); manual workflow_dispatch runs always
# publish. versionCode: gradle's versionCode is a floor; each release uses
# max(gradle versionCode, latest published versionCode + 1) so a bumped
# version still produces a strictly newer update. versionName comes from
# gradle; when CI auto-increments the code beyond it, the release display
# name becomes "<versionName> (build <code>)".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (overrides the commit log)'
        required: false
        default: ''

name: Self-update release

permissions:
  contents: write

concurrency:
  group: self-update-release
  cancel-in-progress: false

jobs:
  # Publishes happen on a human decision, not on every green main: a push
  # releases only when it changed versionName/versionCode in
  # app-native/build.gradle. Manual dispatches always release.
  version:
    name: Version bump check
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether to release
        id: gate
        run: |
          decide() { echo "release=$1" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "manual dispatch: releasing"
            decide true
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no before-SHA on this push: releasing"
            decide true
            exit 0
          fi
          OLD_NAME=$(git show "$BEFORE:app-native/build.gradle" | sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' | head -1)
          OLD_CODE=$(git show "$BEFORE:app-native/build.gradle" | sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' | head -1)
          NEW_NAME=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app-native/build.gradle | head -1)
          NEW_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' app-native/build.gradle | head -1)
          echo "before: $OLD_NAME ($OLD_CODE) -> after: $NEW_NAME ($NEW_CODE)"
          if [ "$OLD_NAME" = "$NEW_NAME" ] && [ "$OLD_CODE" = "$NEW_CODE" ]; then
            echo "version unchanged: skipping release"
            decide false
          else
            echo "version changed: releasing"
            decide true
          fi

  release:
    name: Build & publish update
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Must run before checkout: six private repositories are pulled in as
      # (nested) submodules — rustpush, telephony_plus, apple-private-apis,
      # open-absinthe, clearadi, android-smsmms — and GITHUB_TOKEN only sees
      # this repo.
      # GitHub allows a deploy key on a single repository, so each gets its
      # own read-only key plus an SSH host alias.
      - name: Grant submodule read access (read-only deploy keys)
        env:
          KEY_RUSTPUSH: ${{ secrets.SUBMODULE_KEY_RUSTPUSH }}
          KEY_TELEPHONY: ${{ secrets.SUBMODULE_KEY_TELEPHONY }}
          KEY_APIS: ${{ secrets.SUBMODULE_KEY_APIS }}
          KEY_ABSINTHE: ${{ secrets.SUBMODULE_KEY_ABSINTHE }}
          KEY_CLEARADI: ${{ secrets.SUBMODULE_KEY_CLEARADI }}
          KEY_SMSMMS: ${{ secrets.SUBMODULE_KEY_SMSMMS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # alias|env var with the key|repository (owner/name)
          cat <<'ALIASES' | while IFS='|' read -r alias keyvar repo; do
          github-rustpush|KEY_RUSTPUSH|mweinbach/rustpush-private
          github-telephony|KEY_TELEPHONY|mweinbach/telephony_plus
          github-apis|KEY_APIS|mweinbach/apple-private-apis-private
          github-absinthe|KEY_ABSINTHE|mweinbach/openabsinthe-private
          github-clearadi|KEY_CLEARADI|mweinbach/clearadi-private
          github-smsmms|KEY_SMSMMS|mweinbach/android-smsmms
          ALIASES
            key="${!keyvar}"
            if [ -z "$key" ]; then echo "missing secret $keyvar" >&2; exit 1; fi
            printf '%s\n' "$key" > ~/.ssh/id_$alias
            chmod 600 ~/.ssh/id_$alias
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile ~/.ssh/id_$alias"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            git config --global \
              url."ssh://$alias/$repo.git".insteadOf "https://github.com/$repo.git"
          done

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Caches the Gradle user home (wrapper, dependency cache, local build
      # cache from org.gradle.caching=true) between runs. cache-read-only
      # must be false: releases are dispatched from m4-cutover, and the
      # action only writes caches from the default branch otherwise.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      # Retries + timeouts: a flaky Ubuntu mirror once wedged this step for
      # the job's full 60-minute limit with no error to show for it.
      - name: Install Protobuf compiler
        timeout-minutes: 5
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              update -qq
            sudo apt-get -o Acquire::Retries=3 install -y protobuf-compiler
          fi
          protoc --version

      # The NDK must match ndkVersion in app-native/build.gradle; without a
      # cache AGP re-downloads ~2 GB every run. Absolute path: runner env
      # vars like ANDROID_HOME are not visible in `with:` expressions.
      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ${{ runner.os }}-ndk-28.2.13676358

      # Cargo registry/git checkouts plus the host target dirs (rustpush unit
      # tests, UniFFI check). restore-keys keep stale-but-useful deps when
      # lockfiles move; Cargo rebuilds only what changed.
      - name: Cache Cargo registry and host builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rustpush/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('rust/Cargo.lock', 'rustpush/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-

      # The Android cdylib builds (2 ABIs x debug/release) via
      # app-native/cargo-android.gradle with CARGO_TARGET_DIR here.
      - name: Cache Android Cargo builds
        uses: actions/cache@v5
        with:
          path: build-native/app-native/cargo-android/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock', 'rustpush/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Set up fake Fairplay keys
        run: |
          mkdir -p rustpush/certs/fairplay
          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )
          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Point the native build at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > native/local.properties

      - name: Restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compute release version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GRADLE_NAME=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app-native/build.gradle | head -1)
          GRADLE_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' app-native/build.gradle | head -1)
          [ -n "$GRADLE_NAME" ] && [ -n "$GRADLE_CODE" ] || { echo "cannot read version from app-native/build.gradle" >&2; exit 1; }
          case "$GRADLE_CODE" in ''|*[!0-9]*) echo "versionCode is not numeric: $GRADLE_CODE" >&2; exit 1 ;; esac

          # Latest published versionCode, or 0 when no release exists yet.
          # (gh api writes the 404 body to stdout, so the call is guarded by
          # exit status and every parsed value is re-validated as numeric.)
          PREV=0
          if gh api "repos/${{ github.repository }}/releases/latest" > latest-release.json 2>/dev/null; then
            PREV_ASSET=$(jq -r '[.assets[] | select(.name == "update.json") | .url][0] // empty' latest-release.json)
            if [ -n "$PREV_ASSET" ]; then
              PREV=$(gh api "$PREV_ASSET" -H "Accept: application/octet-stream" | jq -r '.versionCode')
            fi
          fi
          case "$PREV" in ''|*[!0-9]*) PREV=0 ;; esac
          [ "$PREV" -lt "$GRADLE_CODE" ] && CODE="$GRADLE_CODE" || CODE=$((PREV + 1))

          # Stamp the build (runner-local; gradle stays the floor for humans).
          sed -i "s/^[[:space:]]*versionCode .*/        versionCode $CODE/" app-native/build.gradle
          if [ "$CODE" -eq "$GRADLE_CODE" ]; then
            DISPLAY="$GRADLE_NAME"
          else
            DISPLAY="$GRADLE_NAME (build $CODE)"
          fi

          {
            echo "version_name=$GRADLE_NAME"
            echo "version_code=$CODE"
            echo "tag=v${GRADLE_NAME}-${CODE}"
            echo "display=$DISPLAY"
            echo "asset=openbubbles-${GRADLE_NAME}-${CODE}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          cd native
          ./gradlew :app-native:assembleRelease --console=plain

      - name: Stage assets and write update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_IN="build-native/app-native/outputs/apk/release/app-native-release.apk"
          [ -f "$APK_IN" ] || { echo "release APK missing at $APK_IN" >&2; exit 1; }
          cp "$APK_IN" "${{ steps.ver.outputs.asset }}"

          # Verify the APK really is production-signed before publishing.
          # apksigner exits non-zero on a bad signature; the grep proves a
          # certificate digest was printed (output format varies by
          # build-tools: "Signer #1 certificate …" / "V2 Signer: certificate …").
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          "$BT/apksigner" verify --print-certs "${{ steps.ver.outputs.asset }}" | tee certs.txt
          grep -q "certificate SHA-256 digest:" certs.txt

          SHA256=$(shasum -a 256 "${{ steps.ver.outputs.asset }}" | awk '{print $1}')
          BYTES=$(wc -c < "${{ steps.ver.outputs.asset }}" | tr -d ' ')

          # Release notes, in order of preference:
          #   1. workflow_dispatch `notes` input
          #   2. the `## v<versionName>` section of assets/changelog/changelog.md
          #      (kept current for each release; this is the documented path)
          #   3. the commit log since the previous release tag
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            printf '%s\n' "${{ github.event.inputs.notes }}" > release-notes.md
          else
            python3 scripts/extract-release-notes.py \
              "${{ steps.ver.outputs.version_name }}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "$PREV_TAG..HEAD" > release-notes.md
            else
              git log --oneline -20 > release-notes.md
            fi
          fi

          python3 scripts/update-feed.py \
            --code "${{ steps.ver.outputs.version_code }}" \
            --display "${{ steps.ver.outputs.display }}" \
            --asset "${{ steps.ver.outputs.asset }}" \
            --sha256 "$SHA256" \
            --bytes "$BYTES" \
            --notes-file release-notes.md > update.json
          cat update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "${{ steps.ver.outputs.asset }}" update.json \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "OpenBubbles ${{ steps.ver.outputs.display }}" \
            --notes-file release-notes.md
